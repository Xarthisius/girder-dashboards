name: Testing and Linting

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12"]
    services:
      mongodb:
        image: mongo:4.4
        ports:
          - 27017:27017
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: girder_dashboards/web_client/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox
      # This must precede pytest. The plugin's load() calls
      # registerPluginStaticContent, which md5-hashes each file in
      # web_client/dist to build cache-busting URLs -- so without the bundle
      # every test using the `server` fixture dies on FileNotFoundError.
      - name: Build web client
        run: |
          cd girder_dashboards/web_client
          npm ci
          npm run build
      - name: Cache tox environments
        uses: actions/cache@v4
        with:
          path: .tox
          key: ${{ matrix.python-version }}-tox-${{ hashFiles('setup.py', 'requirements-dev.txt', 'tox.ini') }}
      - name: Run linter
        run: tox -e lint
      - name: Run tests with coverage
        env:
          GIRDER_MAX_CURSOR_TIMEOUT_MS: 60000
        run: tox -e pytest
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  browser:
    name: Browser end-to-end
    runs-on: ubuntu-24.04
    services:
      mongodb:
        image: mongo:4.4
        ports:
          - 27017:27017
    env:
      GIRDER_URL: http://127.0.0.1:8989
      GIRDER_ADMIN: admin
      GIRDER_PASSWORD: adminpassword
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the plugin
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Build web client
        run: |
          cd girder_dashboards/web_client
          npm ci
          npm run build
      # verify.cjs prefers the runner's system Chrome and falls back to the
      # bundled chromium, so install the latter to keep the job working on
      # images that ship no Chrome.
      - name: Install browser test dependencies
        run: |
          cd test/browser
          npm ci
          npx playwright install --with-deps chromium
      - name: Start Girder
        run: |
          GIRDER_MONGO_URI=mongodb://localhost:27017/girder_dashboards_ci \
            girder serve --host 127.0.0.1 --port 8989 > girder.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf "$GIRDER_URL/api/v1/system/version" > /dev/null; then break; fi
            sleep 2
          done
          curl -sf "$GIRDER_URL/api/v1/system/version" > /dev/null \
            || { echo '::error::Girder failed to start'; cat girder.log; exit 1; }
      - name: Seed the instance
        run: python3 test/browser/seed.py
      - name: Verify in a browser
        run: node test/browser/verify.cjs
      - name: Upload screenshots and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: |
            test/browser/screenshots/
            girder.log
          if-no-files-found: warn
          retention-days: 7
