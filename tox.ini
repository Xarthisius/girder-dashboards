[tox]
envlist = lint,pytest
skipsdist = false

[testenv]
package = wheel
wheel_build_env = .pkg

[testenv:pytest]
# The Precipitate Analysis dashboard's numpy/scipy/scikit-image stack is an extra
# rather than a hard requirement, but its tests are part of the suite.
extras =
  precipitate
deps =
  -rrequirements-dev.txt
commands =
  pytest --verbose               \
         --cov=girder_dashboards \
         --cov-report=term       \
         --cov-report=xml        \
         {posargs}

[testenv:lint]
skip_install = true
skipdist = true
deps =
  ruff
commands =
  ruff check {posargs:.}

[pytest]
cache_dir = build/test/pytest_cache
junit_family = xunit2
testpaths = girder_dashboards/tests
